<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bars AR Ruler</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007AFF">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: sans-serif;
        }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; font-size: 16px; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #ui {
            position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 20;
            display: flex; justify-content: center; gap: 15px;
        }
        .btn {
            background: #007AFF; color: white; border: none; padding: 14px 24px;
            font-size: 16px; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.5);
            font-weight: bold;
        }
        .btn-danger { background: #FF3B30; }
    </style>
</head>
<body>

    <div id="info">Натисніть «Запустити AR», наведіть на підлогу та торкайтеся для вимірювання</div>
    
    <div id="ui">
        <!-- Кнопка запуску WebXR AR з'явиться тут або викликатиметься через Three.js -->
    </div>

    <!-- Підключаємо Three.js та ARButton -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>

    <script>
        let container;
        let camera, scene, renderer;
        let controller;

        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let points = [];
        let lineMesh = null;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Додаємо кнопку запуску AR у браузері
            let arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            document.getElementById('ui').appendChild(arButton);

            // Освітлення
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Контролер для тапу по екрану в AR
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Маркер поверхні (кільце, яке бігає по підлозі)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00FF00 })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize, false);
        }

        // Дія при тапу на екран у режимі AR (ставимо точку)
        function onSelect() {
            if (reticle.visible) {
                const position = new THREE.Vector3();
                position.setFromMatrixPosition(reticle.matrix);

                // Створюємо маленьку сферу-точку
                const geometry = new THREE.SphereGeometry(0.02, 16, 16);
                const material = new THREE.MeshBasicMaterial({ color: 0x00FF00 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.copy(position);
                scene.add(sphere);

                points.push(position);

                // Якщо є дві точки, рахуємо відстань між ними у метрах / сантиметрах
                if (points.length === 2) {
                    const distance = points[0].distanceTo(points[1]);
                    alert(`Виміряна відстань: ${(distance * 100).toFixed(1)} см`);
                    
                    // Скидаємо для наступного виміру
                    points = [];
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.end.then(() => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
