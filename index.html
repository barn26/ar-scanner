<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Object Scanner</title>
    <!-- Підключення маніфесту для PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007AFF">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: sans-serif;
        }
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; font-size: 18px;
        }
        video, canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        canvas { z-index: 10; pointer-events: none; }
        #ui {
            position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 20;
        }
        .btn {
            background: #007AFF; color: white; border: none; padding: 14px 28px;
            font-size: 16px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.4);
            font-weight: bold;
        }
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 16px; z-index: 300; width: 80%; max-width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); color: #333;
        }
        #modal input {
            width: 100%; padding: 10px; margin: 8px 0 20px 0; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2>Завантаження системи...</h2>
        <p id="loadStatus">Ініціалізація камери та середовища</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <button class="btn" onclick="openTrainingMode()">➕ Навчити об'єкт (Тап)</button>
    </div>

    <div id="modal">
        <h3>Новий об'єкт</h3>
        <label>Назва:</label>
        <input type="text" id="objName" placeholder="Наприклад, Коробка">
        <label>Реальна висота (см):</label>
        <input type="number" id="objHeight" placeholder="Наприклад, 30">
        <button class="btn" style="width:100%;" onclick="saveTrainedObject()">Зберегти</button>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let isReady = false;
        let trainingMode = false;
        
        let trainedObjects = JSON.parse(localStorage.getItem('ar_objects') || '[]');

        // Реєстрація Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("PWA Service Worker зареєстровано"))
                .catch(err => console.log("Помилка SW: ", err));
        }

        // Запуск камери
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                document.getElementById('loader').style.display = 'none';
                isReady = true;
                requestAnimationFrame(processVideo);
            })
            .catch(err => {
                document.getElementById('loadStatus').innerText = "Помилка камери: " + err.message;
            });

        function openTrainingMode() {
            trainingMode = true;
            alert("Наведіть приціл на об'єкт і торкніться екрана в місці об'єкта!");
        }

        window.addEventListener('click', (e) => {
            if (!isReady) return;
            if (trainingMode && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                let rect = canvas.getBoundingClientRect();
                window.tapX = e.clientX - rect.left;
                window.tapY = e.clientY - rect.top;
                
                document.getElementById('modal').style.display = 'block';
                trainingMode = false;
            }
        });

        function saveTrainedObject() {
            let name = document.getElementById('objName').value;
            let height = parseFloat(document.getElementById('objHeight').value);

            if (!name || !height) {
                alert("Заповніть усі поля!");
                return;
            }

            trainedObjects.push({
                id: Date.now(),
                name: name,
                height: height,
                x: window.tapX,
                y: window.tapY
            });

            localStorage.setItem('ar_objects', JSON.stringify(trainedObjects));
            document.getElementById('modal').style.display = 'none';
            document.getElementById('objName').value = '';
            document.getElementById('objHeight').value = '';
            alert("Збережено!");
        }

        function processVideo() {
            if (!isReady) return;

            canvas.width = video.videoWidth || window.innerWidth;
            canvas.height = video.videoHeight || window.innerHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            trainedObjects.forEach(obj => {
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 4;
                ctx.strokeRect(obj.x - 45, obj.y - 45, 90, 90);

                ctx.fillStyle = '#00FF00';
                ctx.font = 'bold 18px Arial';
                ctx.fillText(`📌 ${obj.name}`, obj.x - 45, obj.y - 55);
                
                let distance = (obj.height * 550) / 90; 
                ctx.fillText(`Відстань: ~${(distance/100).toFixed(1)} м`, obj.x - 45, obj.y + 70);
            });

            requestAnimationFrame(processVideo);
        }
    </script>
</body>
</html>
